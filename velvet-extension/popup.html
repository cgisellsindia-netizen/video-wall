<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#120a1d;color:#f5e9ff;font:14px system-ui;width:360px;padding:15px;box-sizing:border-box;margin:0}h2{margin:0 0 5px}small{color:#baacc9}button,select{width:100%;padding:11px;border-radius:10px;margin:7px 0;background:#41275f;color:white;border:1px solid #63457b}button{cursor:pointer}button.primary{background:#d9b673;color:#180d22;font-weight:700}textarea{box-sizing:border-box;background:#211331;color:#f5e9ff;border:1px solid #705b81;border-radius:10px;padding:9px;width:100%;min-height:120px;resize:vertical}#result{white-space:pre-wrap;line-height:1.5;background:#211331;border:1px solid #60416c;padding:12px;border-radius:10px;margin:10px 0}p{line-height:1.55;color:#c6b5d0}a{color:#e2c482}</style></head><body><h2>✦ VELVET <span style="color:#e2c482">AI</span></h2><small>PRIVATE MESSENGER COPILOT</small><p>Open an existing chat on Facebook Messenger, then click below to read only the visible conversation. Nothing is sent automatically.</p><button class="primary" id="read">Read open conversation</button><textarea id="chat" placeholder="Visible chat will appear here; you can edit it."></textarea><select id="goal"><option value="friendly">Friendly</option><option value="flirty">Playful flirting</option><option value="casual">Discuss casual intentions</option></select><button id="draft">Suggest reply</button><div id="result" role="status">Your suggested reply will appear here.</div><button id="copy">Copy reply</button><p id="status"></p><small>Manual approval required. Respects refusals and boundaries. <a target="_blank" href="https://velvet-ai-live.onrender.com">Open Velvet Web</a></small><script src="popup.js"></script></body></html>
