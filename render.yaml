services:
  - type: web
    name: camigo-store
    env: node
    buildCommand: npm install --prefix backend && npm install --prefix instamart-web && npm run build --prefix instamart-web
    startCommand: npm start --prefix backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: UBER_DIRECT_CUSTOMER_ID
        sync: false
      - key: UBER_DIRECT_CLIENT_ID
        sync: false
      - key: UBER_DIRECT_CLIENT_SECRET
        sync: false
      - key: UBER_DIRECT_STORE_ID
        sync: false
      - key: UBER_DIRECT_PICKUP_PHONE
        sync: false
      - key: UBER_DIRECT_PICKUP_INSTRUCTIONS
        sync: false
      - key: DELHIVERY_API_TOKEN
        sync: false
      - key: DELHIVERY_CLIENT_NAME
        sync: false
      - key: DELHIVERY_PICKUP_LOCATION
        sync: false
      - key: DELHIVERY_SELLER_NAME
        sync: false
      - key: DELHIVERY_SELLER_PHONE
        sync: false
      - key: DELHIVERY_SELLER_ADDRESS
        sync: false
      - key: DELHIVERY_SELLER_PINCODE
        sync: false
      - key: DELHIVERY_SELLER_CITY
        sync: false
      - key: DELHIVERY_SELLER_STATE
        sync: false
      - key: DELHIVERY_SELLER_COUNTRY
        sync: false
      - key: DELHIVERY_SELLER_GSTIN
        sync: false
      - key: DELHIVERY_HSN_CODE
        sync: false
      - key: CORS_ORIGINS
        value: ""
