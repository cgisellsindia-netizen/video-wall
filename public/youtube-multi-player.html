<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Multi Player</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      margin: 0;
      background: #0f1115;
      color: white;
    }

    header {
      background: #171923;
      padding: 14px 18px;
      border-bottom: 1px solid #2c2f3a;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .sub {
      color: #aeb4c2;
      font-size: 12px;
      margin-top: 5px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 100px 140px 140px;
      gap: 10px;
      padding: 14px;
      background: #171923;
      border-bottom: 1px solid #2c2f3a;
    }

    input, select, button {
      padding: 10px;
      border-radius: 9px;
      border: 1px solid #333746;
      background: #0f1115;
      color: white;
      font-size: 13px;
    }

    button {
      border: none;
      background: #19c37d;
      color: #06170f;
      font-weight: bold;
      cursor: pointer;
    }

    .clear {
      background: #ff4d4d;
      color: white;
    }

    .grid {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .tile {
      background: #171923;
      border: 1px solid #2c2f3a;
      border-radius: 12px;
      overflow: hidden;
    }

    .tileTop {
      padding: 9px 11px;
      border-bottom: 1px solid #2c2f3a;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    iframe {
      width: 100%;
      height: 420px;
      border: none;
      background: black;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }

      iframe {
        height: 300px;
      }
    }
  </style>
</head>

<body>
<header>
  <h1>YouTube Multi Player</h1>
  <div class="sub">Official YouTube embed players inside your website</div>
</header>

<div class="controls">
  <input id="url" placeholder="Paste YouTube watch / shorts / youtu.be link" />
  <input id="count" type="number" value="4" min="1" max="20" />
  <select id="mute">
    <option value="1" selected>Muted</option>
    <option value="0">Sound On</option>
  </select>
  <button onclick="openPlayers()">Open Players</button>
  <button class="clear" onclick="clearPlayers()">Clear</button>
</div>

<div id="grid" class="grid"></div>

<script>
function getYouTubeId(input) {
  try {
    const url = new URL(input);

    if (url.hostname.includes("youtube.com") && url.pathname === "/watch") {
      return url.searchParams.get("v");
    }

    if (url.hostname.includes("youtube.com") && url.pathname.startsWith("/shorts/")) {
      return url.pathname.split("/shorts/")[1].split("/")[0];
    }

    if (url.hostname.includes("youtu.be")) {
      return url.pathname.replace("/", "");
    }

    return input.trim();
  } catch {
    return input.trim();
  }
}

function openPlayers() {
  clearPlayers();

  const raw = document.getElementById("url").value.trim();
  const count = Number(document.getElementById("count").value || 1);
  const mute = document.getElementById("mute").value;

  const id = getYouTubeId(raw);

  if (!id) {
    alert("Paste YouTube URL first");
    return;
  }

  localStorage.setItem("ytMulti.url", raw);
  localStorage.setItem("ytMulti.count", count);
  localStorage.setItem("ytMulti.mute", mute);

  const grid = document.getElementById("grid");

  for (let i = 1; i <= count; i++) {
    const tile = document.createElement("div");
    tile.className = "tile";

    const src =
      "https://www.youtube.com/embed/" +
      encodeURIComponent(id) +
      "?enablejsapi=1" +
      "&playsinline=1" +
      "&rel=0" +
      "&mute=" + mute;

    tile.innerHTML = `
      <div class="tileTop">
        <b>Player ${i}</b>
        <span>YouTube Embed</span>
      </div>
      <iframe
        src="${src}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    `;

    grid.appendChild(tile);
  }
}

function clearPlayers() {
  document.getElementById("grid").innerHTML = "";
}

window.addEventListener("load", () => {
  document.getElementById("url").value = localStorage.getItem("ytMulti.url") || "";
  document.getElementById("count").value = localStorage.getItem("ytMulti.count") || "4";
  document.getElementById("mute").value = localStorage.getItem("ytMulti.mute") || "1";
});
</script>
</body>
</html>
