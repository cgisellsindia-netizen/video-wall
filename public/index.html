<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CGI Multi Browser Testing Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>CGI Multi Browser Testing Dashboard</h1>
    <p>For own website/video testing only</p>
  </header>

  <section class="panel">
    <label>Website / Video URL</label>
    <input id="url" value="https://www.pexels.com/download/video/35510817/" />

    <label>How many browsers?</label>
    <input id="count" type="number" min="1" max="12" value="2" />

    <label>Upload proxy file optional</label>
    <input id="proxyfile" type="file" accept=".txt,.csv" />

    <div class="buttons">
      <button onclick="uploadProxies()">Upload Proxies</button>
      <button onclick="startTest()">Start Test</button>
      <button class="stop" onclick="stopTest()">Stop All</button>
    </div>

    <div id="status"></div>
  </section>

  <section id="grid"></section>

  <script src="app.js"></script>
</body>
</html>
