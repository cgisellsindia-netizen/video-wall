<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CGI Multi Browser Testing Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>CGI Multi Browser Testing Dashboard</h1>
    <p>Use local mode for real browser feel. Render mode is only screenshot preview.</p>
  </header>

  <section class="panel">
    <div class="warning">
      Free SOCKS proxies often show CAPTCHA. For clean testing use trusted ISP/residential proxies or your own network.
    </div>

    <label>Website / Video URL</label>
    <input id="url" value="https://getcamigo.in" />

    <label>How many browsers?</label>
    <input id="count" type="number" min="1" max="10" value="1" />

    <label>Upload proxy file optional</label>
    <input id="proxyfile" type="file" accept=".txt,.csv" />

    <div class="buttons">
      <button onclick="uploadProxies()">Upload Proxies</button>
      <button onclick="startTest()">Start</button>
      <button class="stop" onclick="stopTest()">Stop All</button>
    </div>

    <div id="status"></div>
    <div id="proxyStats" class="stats"></div>
  </section>

  <section id="grid"></section>

  <script src="app.js"></script>
</body>
</html>
