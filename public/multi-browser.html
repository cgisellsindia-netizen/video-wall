<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Simple Multi Browser Tiles</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f1115;
      color: white;
    }

    header {
      background: #171923;
      padding: 12px 16px;
      border-bottom: 1px solid #2c2f3a;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .sub {
      color: #aeb4c2;
      font-size: 12px;
      margin-top: 4px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 100px 100px 120px 120px;
      gap: 10px;
      padding: 12px;
      background: #171923;
      border-bottom: 1px solid #2c2f3a;
    }

    input, button {
      border-radius: 8px;
      border: 1px solid #333746;
      padding: 10px;
      background: #0f1115;
      color: white;
      font-size: 13px;
    }

    button {
      background: #19c37d;
      color: #06170f;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .stop {
      background: #ff4d4d;
      color: white;
    }

    .grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .tile {
      background: #171923;
      border: 1px solid #2c2f3a;
      border-radius: 12px;
      overflow: hidden;
      min-height: 360px;
    }

    .tileTop {
      padding: 8px 10px;
      border-bottom: 1px solid #2c2f3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .status {
      color: #73a7ff;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: none;
      background: white;
    }

    .small iframe {
      height: 360px;
    }

    .medium iframe {
      height: 520px;
    }

    .large iframe {
      height: 680px;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Simple Multi Browser Tiles</h1>
    <div class="sub">No Playwright · no Chromium · simple iframe-based testing page</div>
  </header>

  <div class="controls">
    <input id="url" placeholder="Enter video/page URL" value="https://example.com" />
    <input id="count" type="number" value="4" min="1" max="30" />
    <input id="reloadSec" type="number" value="0" min="0" />
    <button onclick="openTiles()">Open Tiles</button>
    <button class="stop" onclick="clearTiles()">Clear</button>
  </div>

  <div style="padding: 0 12px 8px 12px; color:#aeb4c2; font-size:12px;">
    Count = number of tiles. Reload seconds = 0 means no auto reload.
  </div>

  <div id="grid" class="grid"></div>

  <script>
    let reloadTimer = null;

    function normalizeYouTubeUrl(url) {
      try {
        const u = new URL(url);

        // YouTube normal video
        if (u.hostname.includes("youtube.com") && u.pathname === "/watch") {
          const id = u.searchParams.get("v");
          if (id) {
            return "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1";
          }
        }

        // YouTube Shorts
        if (u.hostname.includes("youtube.com") && u.pathname.startsWith("/shorts/")) {
          const id = u.pathname.split("/shorts/")[1].split("/")[0];
          if (id) {
            return "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1";
          }
        }

        // youtu.be short link
        if (u.hostname.includes("youtu.be")) {
          const id = u.pathname.replace("/", "");
          if (id) {
            return "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1";
          }
        }

        return url;
      } catch {
        return url;
      }
    }

    function openTiles() {
      clearTiles();

      const rawUrl = document.getElementById("url").value.trim();
      const url = normalizeYouTubeUrl(rawUrl);
      const count = Number(document.getElementById("count").value || 1);
      const reloadSec = Number(document.getElementById("reloadSec").value || 0);
      const grid = document.getElementById("grid");

      localStorage.setItem("simpleMulti.url", rawUrl);
      localStorage.setItem("simpleMulti.count", count);
      localStorage.setItem("simpleMulti.reloadSec", reloadSec);

      for (let i = 1; i <= count; i++) {
        const tile = document.createElement("div");
        tile.className = "tile medium";

        tile.innerHTML = `
          <div class="tileTop">
            <b>Browser Tile ${i}</b>
            <span class="status">Loaded</span>
          </div>
          <iframe
            src="${url}"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen>
          </iframe>
        `;

        grid.appendChild(tile);
      }

      if (reloadSec > 0) {
        reloadTimer = setInterval(() => {
          document.querySelectorAll("iframe").forEach(frame => {
            frame.src = frame.src;
          });
        }, reloadSec * 1000);
      }
    }

    function clearTiles() {
      if (reloadTimer) {
        clearInterval(reloadTimer);
        reloadTimer = null;
      }

      document.getElementById("grid").innerHTML = "";
    }

    window.addEventListener("load", () => {
      const savedUrl = localStorage.getItem("simpleMulti.url");
      const savedCount = localStorage.getItem("simpleMulti.count");
      const savedReload = localStorage.getItem("simpleMulti.reloadSec");

      if (savedUrl) document.getElementById("url").value = savedUrl;
      if (savedCount) document.getElementById("count").value = savedCount;
      if (savedReload) document.getElementById("reloadSec").value = savedReload;
    });
  </script>
</body>
</html>
