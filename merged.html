<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Tester + Video Wall</title>
<style>
:root { --bg: #0b0d14; --surface: #141724; --border: #242838; --muted: #8b92a8; --text: #e8eaf0; --accent: #4f8cff; --success: #2ecc71; --warn: #f1c40f; --error: #e74c3c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI",system-ui,sans-serif; min-height: 100vh; }
header { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
h1 { font-size: 20px; }
.subtitle { color: var(--muted); font-size: 12px; }
.container { padding: 20px; max-width: 1600px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
label { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
input, textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; margin-bottom: 14px; }
textarea { min-height: 100px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media(max-width: 900px) { .row { grid-template-columns: 1fr; } }
button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.secondary { background: var(--border); }
.actions { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; min-width: 120px; text-align: center; }
.stat .label2 { color: var(--muted); font-size: 11px; }
.stat .num { font-size: 22px; font-weight: bold; margin-top: 4px; }
.stat .good { color: var(--success); }
.stat .bad { color: var(--error); }
.stat .warn { color: var(--warn); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.3s; position: relative; }
.tile.working { border-color: var(--success); }
.tile.failed { border-color: var(--error); display: none !important; }
.tile.testing { border-color: var(--warn); }
.tile-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.tile-title { font-weight: 600; font-size: 13px; }
.tile-status { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.tile-status.testing { background: rgba(241,196,15,0.15); color: var(--warn); }
.tile-status.working { background: rgba(46,204,113,0.15); color: var(--success); }
.tile-status.failed { background: rgba(231,76,60,0.15); color: var(--error); }
.tile-status.skipped { background: rgba(139,146,168,0.15); color: var(--muted); }
.tile-media { min-height: 200px; background: #0a0c12; display: flex; align-items: center; justify-content: center; position: relative; }
.tile-media iframe { width: 100%; height: 200px; border: none; display: block; }
.tile-media video { width: 100%; height: 200px; display: block; background: black; }
.tile-media .placeholder { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
.tile-foot { padding: 10px 14px; font-size: 12px; color: var(--muted); }
.tile-proxy-badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; z-index: 10; pointer-events: none; }
.log-panel { max-height: 160px; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 11px; }
.log-line { padding: 2px 0; border-bottom: 1px solid var(--border); }
.log-line.success { color: var(--success); }
.log-line.error { color: var(--error); }
.log-line.warn { color: var(--warn); }
.bot-result { background: #1a1d2a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 8px 0; }
.bot-result .bot-title { color: var(--accent); font-weight: bold; margin-bottom: 6px; }
.bot-result .bot-signal { display: inline-block; background: #2a2d3a; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 11px; }
.bot-result .bot-signal.bad { background: #3a1a1a; color: var(--error); }
.bot-result .bot-signal.good { background: #1a3a1a; color: var(--success); }
.proxy-file { border: 2px dashed var(--border); padding: 20px; border-radius: 10px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 14px; }
.proxy-file:hover { border-color: var(--accent); }
.proxy-file input { display: none; }
</style>
<script src="bot-detector.js"></script>
<script>
let botSimProxyIndex=0;

function getBotUA(profile){
  const uas={
    'multi-watch':'Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US) AppleWebKit/525.13 (KHTML, like Gecko) Chrome/0.A.B.C Safari/525.13',
    'old-chrome':'Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.36',
    'headless':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/120.0.0.0 Safari/537.36',
    'android-webview':'Mozilla/5.0 (Linux; Android 10; SM-G973F) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/120.0.0.0 Mobile Safari/537.36',
    'real-desktop':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
  };
  return uas[profile]||uas['multi-watch'];
}

function injectBotScripts(iframe,profile){
  try{
    var doc=iframe.contentDocument||iframe.contentWindow.document;
    var script=doc.createElement('script');
    script.textContent='(function(){'+
      'window.AppInventor={getWebViewString:function(){return "";},setWebViewString:function(v){}};'+
      'Object.defineProperty(navigator,"webdriver",{get:function(){return ' + (profile==='headless'?'true':'false') + ';},configurable:true});'+
      'Object.defineProperty(navigator,"plugins",{get:function(){return [];},configurable:true});'+
      'Object.defineProperty(navigator,"languages",{get:function(){return [];},configurable:true});'+
      'window.outerWidth=0;window.outerHeight=0;'+
      '})();';
    doc.head.appendChild(script);
    log('Bot sim: injected signatures','warn');
  }catch(e){log('Bot sim inject error: '+e.message,'error');}
}

async function runBotSim(proxy,index){
  var targetUrl=document.getElementById('targetUrl').value.trim();
  var profile=document.getElementById('botProfile').value;
  var ua=getBotUA(profile);
  log('Bot Sim ['+profile+'] proxy '+(index+1)+' -> '+targetUrl,'warn');
  
  var grid=document.getElementById('grid');
  var tile=document.createElement('div');
  tile.className='tile working';
  tile.id='tile-'+index;
  tile.innerHTML='<div style="padding:10px"><div>Bot Sim Proxy '+(index+1)+'</div><div style="font-size:9px">UA: '+ua.substring(0,55)+'...</div><div id="bot-status-'+index+'">Loading...</div><div id="countdown-'+index+'" style="color:#e67e22"></div></div>';
  grid.appendChild(tile);
  
  var iframe=document.createElement('iframe');
  iframe.className='tile-frame';
  iframe.style.height='180px';
  iframe.sandbox='allow-scripts allow-same-origin allow-presentation';
  
  iframe.onload=function(){
    tile.querySelector('#bot-status-'+index).textContent='Injecting bot sigs...';
    setTimeout(function(){injectBotScripts(iframe,profile);},500);
    tile.querySelector('#bot-status-'+index).textContent='Running '+ (profile==='headless'?'30':'45') +'s timer...';
    
    var seconds=profile==='headless'?30:45;
    var cd=document.getElementById('countdown-'+index);
    var iv=setInterval(function(){
      seconds--;
      if(cd)cd.textContent=seconds+'s remaining';
      if(seconds<=0)clearInterval(iv);
    },1000);
    
    setTimeout(function(){
      tile.style.transition='opacity 0.5s';
      tile.style.opacity='0';
      setTimeout(function(){if(tile.parentNode)tile.parentNode.removeChild(tile);},500);
      log('Bot Sim proxy '+(index+1)+' completed','success');
    },profile==='headless'?30000:45000);
  };
  
  iframe.src=targetUrl;
  tile.appendChild(iframe);
}
</script>
<script>
window.BOT_DETECTOR_CONFIG = {
  debug: true,
  endpoint: '/api/bot-report',
  delay: 2000,
  recheckInterval: 10000,
  onDetect: function(data) {
    console.log('BOT DETECTED:', data);
    var grid = document.getElementById('grid');
    if (grid) {
      var alert = document.createElement('div');
      alert.className = 'tile';
      alert.style.background = '#3a1a1a';
      alert.style.borderColor = 'var(--error)';
      alert.innerHTML = '<div style="padding:20px"><h3 style="color:var(--error);margin:0">Bot Detected!</h3><p>Score: ' + data.score + '/' + data.maxScore + '</p><p>Signals: ' + data.signals.join(', ') + '</p><p>UA: ' + data.userAgent.substring(0,100) + '...</p></div>';
      grid.insertBefore(alert, grid.firstChild);
    }
  }
};</script>
</head>
<body>
<header>
  <div>
    <h1>Proxy Tester + Video Wall</h1>
    <div class="subtitle">Upload proxy list, test internally. Working proxies auto-open in embedded video tiles. Failed tiles auto-hide.</div>
  </div>
</header>
<div class="container">
<div class="panel">
  <div class="row">
    <div>
      <label>Upload Proxy List (.txt file)</label>
      <div class="proxy-file" onclick="document.getElementById('proxyFile').click()">
        <span id="fileLabel">Click to upload proxy list</span>
        <input type="file" id="proxyFile" accept=".txt" onchange="handleFileUpload(event)" />
      </div>
      <button class="secondary" style="margin-top:10px;width:100%;font-size:12px;padding:8px 0" onclick="fetchAllFreeProxies()">Load All Free Proxies (1-click)</button>
      <div style="color:var(--muted);font-size:10px;margin-top:4px;text-align:center">Sources: Geonode, ProxyScrape, Proxy-List (HTTP, SOCKS4, SOCKS5)</div>
    </div>
    <div>
      <label>Or paste proxies here (one per line)</label>
      <textarea id="proxies" placeholder="ip:port:user:pass&#10;http://user:pass@ip:port&#10;socks5://ip:port"></textarea>
    </div>
    <div>
      <label>Target URL to test</label>
      <input id="targetUrl" type="text" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ" />
      <label>Mode</label>
      <select id="mode">
        <option value="iframe" selected>Embedded iframe (old player)</option>
        <option value="video">Direct video tag</option>
        <option value="test-only">Test only (no tiles)</option>
        <option value="bot-test">Real Browser (bot detection test)</option>
        <option value="bot-sim">Bot Simulation (mimic APK behavior)</option>
      </select>
    </div>
  </div>
  <div class="actions">
    <button id="testBtn" onclick="startTest()">Start Test & Auto-Open Tiles</button>
    <button class="secondary" onclick="stopTest()">Stop</button>
    <button class="secondary" onclick="clearAll()">Clear</button>
    <button class="secondary" onclick="toggleFailed()" id="toggleBtn">Show Failed</button>
    <button class="secondary" onclick="toggleAutoRefresh()" id="autoRefreshBtn" style="background:#e67e22">Auto Refresh: OFF</button>
    <button class="secondary" onclick="clearAllData()" style="background:#c0392b">Clear All Data</button>
  </div>
</div>
<div class="stats">
  <div class="stat"><div class="label2">Total</div><div class="num" id="statTotal">0</div></div>
  <div class="stat"><div class="label2">Working</div><div class="num good" id="statWorking">0</div></div>
  <div class="stat"><div class="label2">Failed</div><div class="num bad" id="statFailed">0</div></div>
  <div class="stat"><div class="label2">Pending</div><div class="num warn" id="statPending">0</div></div>
</div>
<div class="grid" id="grid"></div>
<div class="panel" style="margin-top: 20px;">
  <label>Logs</label>
  <div class="log-panel" id="logs"></div>
</div>
</div>
<script>
let running=false,showFailed=false,proxyPool=[],proxyRoundRobin=0,globalMode="iframe",workingTileQueue=[],staggerTimer=null,autoRefreshEnabled=false;
function log(msg,type){
  const logs=document.getElementById("logs");
  const line=document.createElement("div");
  line.className="log-line "+(type||"info");
  line.textContent=new Date().toLocaleTimeString()+" | "+msg;
  logs.insertBefore(line,logs.firstChild);
}
function updateStats(total,working,failed,pending){
  document.getElementById("statTotal").textContent=total;
  document.getElementById("statWorking").textContent=working;
  document.getElementById("statFailed").textContent=failed;
  document.getElementById("statPending").textContent=pending;
}
function toggleFailed(){
  showFailed=!showFailed;
  document.getElementById("toggleBtn").textContent=showFailed?"Hide Failed":"Show Failed";
  document.querySelectorAll(".tile.failed").forEach(function(t){t.style.display=showFailed?"block":"none";});
}
function handleFileUpload(e){
  const file=e.target.files[0];
  if(!file)return;
  document.getElementById("fileLabel").textContent="Loaded: "+file.name;
  const reader=new FileReader();
  reader.onload=function(evt){
    document.getElementById("proxies").value=evt.target.result;
    var lines=evt.target.result.split(String.fromCharCode(10)).filter(function(x){return x.trim();});
    log("Loaded "+file.name+" with "+lines.length+" lines");
  };
  reader.readAsText(file);
}
function pickNextProxy(){
  if(!proxyPool.length)return"";
  var idx=proxyRoundRobin%proxyPool.length;
  proxyRoundRobin=(proxyRoundRobin+1)%proxyPool.length;
  return proxyPool[idx];
}
function wrapUrlThroughProxy(rawUrl,proxyUrl){
  if(!proxyUrl)return rawUrl;
  if(proxyUrl.indexOf("{url}")!==-1)return proxyUrl.replace("{url}",encodeURIComponent(rawUrl));
  return proxyUrl+encodeURIComponent(rawUrl);
}
function parseYouTubeId(url){
  try{
    var parsed=new URL(url);
    if(parsed.hostname.includes("youtu.be"))return parsed.pathname.replace(/^\/+/, "").split("/")[0]||"";
    if(parsed.hostname.includes("youtube.com")){
      if(parsed.pathname.startsWith("/shorts/"))return parsed.pathname.split("/")[2]||"";
      if(parsed.pathname.startsWith("/embed/"))return parsed.pathname.split("/")[2]||"";
      return parsed.searchParams.get("v")||"";
    }
  }catch(e){return"";}
  return"";
}
function parseVimeoId(url){
  try{
    var parsed=new URL(url);
    if(!parsed.hostname.includes("vimeo.com"))return"";
    var parts=parsed.pathname.split("/").filter(Boolean);
    return parts[parts.length-1]||"";
  }catch(e){return"";}
  return"";
}
function inferSourceType(url){
  var safeUrl=String(url||"").trim().toLowerCase();
  if(!safeUrl)return"video";
  if(safeUrl.startsWith("rtsp://"))return"rtsp";
  if(parseYouTubeId(safeUrl))return"youtube";
  if(parseVimeoId(safeUrl))return"vimeo";
  if(safeUrl.endsWith(".m3u8")||safeUrl.includes(".m3u8?"))return"hls";
  if(safeUrl.endsWith(".mp4")||safeUrl.includes(".mp4?")||safeUrl.endsWith(".webm")||safeUrl.includes(".webm?"))return"video";
  if(safeUrl.startsWith("http://")||safeUrl.startsWith("https://"))return"page";
  return"video";
}
function buildEmbedUrl(sourceUrl,sourceType,loop){
  if(sourceType==="youtube"){
    var youtubeId=parseYouTubeId(sourceUrl);
    if(!youtubeId)return"";
    var url="https://www.youtube.com/embed/"+youtubeId+"?autoplay=1&mute=1&playsinline=1&rel=0&_cb="+Date.now();if(loop){url+="&loop=1&playlist="+youtubeId;}return url;
  }
  if(sourceType==="vimeo"){
    var vimeoId=parseVimeoId(sourceUrl);
    if(!vimeoId)return"";
    var url="https://player.vimeo.com/video/"+vimeoId+"?autoplay=1&muted=1&autopause=0&_cb="+Date.now();if(loop){url+="&loop=1";}return url;
  }
  if(sourceType==="page")return sourceUrl;
  return"";
}
function createTile(proxy,index){
  const grid=document.getElementById("grid");
  const tile=document.createElement("div");
  tile.className="tile testing";
  tile.id="tile-"+index;
  tile.innerHTML="<div class=\"tile-head\"><span class=\"tile-title\">Proxy "+(index+1)+"</span><span class=\"tile-status testing\" id=\"status-"+index+"\">Testing...</span></div><div class=\"tile-media\" id=\"media-"+index+"\"><div class=\"placeholder\">Testing proxy internally...</div></div><div class=\"tile-foot\" id=\"foot-"+index+"\">"+proxy+"</div>";
  grid.appendChild(tile);
}
function updateTileBotDetection(index,proxy,targetUrl){
  var tile=document.getElementById("tile-"+index);
  var status=document.getElementById("status-"+index);
  var media=document.getElementById("media-"+index);
  var foot=document.getElementById("foot-"+index);
  tile.className="tile working";
  status.className="tile-status working";
  status.textContent="TESTING BROWSER...";
  foot.textContent=proxy;
  media.innerHTML='<div class="placeholder">Launching real Chromium via proxy...<br><small>Bot detection signals:</small></div>';
  
  fetch("/api/bot-test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({proxy:proxy,targetUrl:targetUrl})})
    .then(function(res){return res.json();})
    .then(function(data){
      if(data.ok&&data.detection){
        var d=data.detection;
        var blocked=d.blocked||d.captcha||d.cloudflare;
        status.textContent=blocked?"BLOCKED":"PASSED";
        status.className=blocked?"tile-status failed":"tile-status working";
        foot.textContent=proxy+" | "+(blocked?"Bot detected":"Bot NOT detected");
        var html='<div style="padding:12px;font-size:12px;overflow:auto;max-height:220px">';
        html+='<b>Title:</b> '+(d.title||"N/A")+'<br>';
        html+='<b>URL:</b> '+(d.url||"N/A")+'<br>';
        html+='<b>Bot Blocked:</b> '+d.blocked+'<br>';
        html+='<b>Captcha:</b> '+d.captcha+'<br>';
        html+='<b>Cloudflare:</b> '+d.cloudflare+'<br>';
        html+='<b>Videos Found:</b> '+(d.videoCount||0)+'<br>';
        html+='<b>Video Playing:</b> '+d.videoPlaying+'<br>';
        html+='</div>';
        media.innerHTML=html;
        log("Bot test "+(blocked?"BLOCKED":"PASSED")+" for "+proxy,blocked?"error":"success");
      }else{
        status.textContent="ERROR";
        status.className="tile-status failed";
        foot.textContent=proxy+" | "+(data.error||"Browser launch failed");
        media.innerHTML='<div class="placeholder">Browser test failed:<br>'+(data.error||"Unknown")+'</div>';
        log("Bot test ERROR for "+proxy+": "+(data.error||"Unknown"),"error");
      }
    })
    .catch(function(e){
      status.textContent="ERROR";
      status.className="tile-status failed";
      foot.textContent=proxy+" | "+e.message;
      log("Bot test fetch error for "+proxy+": "+e.message,"error");
    });
}

function updateTileSuccess(index,proxy,statusCode,targetUrl){
  var tile=document.getElementById("tile-"+index);
  var status=document.getElementById("status-"+index);
  var media=document.getElementById("media-"+index);
  var foot=document.getElementById("foot-"+index);
  tile.className="tile working";
  status.className="tile-status working";
  status.textContent="WORKING";
  foot.textContent=proxy+" | HTTP "+statusCode;
  var sourceType=inferSourceType(targetUrl);
  var embedUrl=buildEmbedUrl(targetUrl,sourceType,false);
  if(globalMode==="iframe"&&embedUrl){
    workingTileQueue.push({index:index,proxy:proxy,statusCode:statusCode,targetUrl:targetUrl,sourceType:sourceType,embedUrl:embedUrl,media:media});
    if(!staggerTimer)processStaggerQueue();
    log("Proxy "+proxy+" WORKS (HTTP "+statusCode+") -> queued for staggered load","success");
  }else if(globalMode==="video"&&(sourceType==="video"||sourceType==="hls")){
    media.innerHTML='<video controls autoplay muted playsinline><source src="'+targetUrl+'"></video>';
    log("Proxy "+proxy+" WORKS (HTTP "+statusCode+") -> opened in video tag","success");
  }else{
    media.innerHTML='<div class="placeholder">Proxy works - embed mode: '+sourceType+'</div>';
    log("Proxy "+proxy+" WORKS (HTTP "+statusCode+") - no embed for type: "+sourceType,"success");
  }
}
function processStaggerQueue(){
  if(!workingTileQueue.length){staggerTimer=null;return;}
  var item=workingTileQueue.shift();
  var iframe=document.createElement("iframe");
  iframe.className="tile-frame";
  iframe.src=item.embedUrl;
  iframe.allow="autoplay; fullscreen; picture-in-picture";
  iframe.referrerPolicy="strict-origin-when-cross-origin";
  iframe.setAttribute("allowfullscreen","true");
  iframe.setAttribute("title","Proxy "+(item.index+1)+" source");
  item.media.innerHTML="";
  item.media.appendChild(iframe);
  scheduleIframeReload(item.index,iframe,item.targetUrl,item.sourceType,item.proxy);
  log("Tile "+(item.index+1)+" iframe loaded (staggered)","success");
  staggerTimer=setTimeout(processStaggerQueue,1200);
}
function scheduleIframeReload(index,iframe,targetUrl,sourceType,currentProxy){
  var reloadMs=45000;
  var timer=setTimeout(function(){
    var tile=document.getElementById("tile-"+index);
    if(!tile||!tile.classList.contains("working")){clearTimeout(timer);return;}
    tile.style.display="none";
    iframe.src="about:blank";
    log("Tile "+(index+1)+" closed after first play (session cleared)","warn");
  },reloadMs);
}
function updateTileFail(index,proxy,error){
  var tile=document.getElementById("tile-"+index);
  var status=document.getElementById("status-"+index);
  var media=document.getElementById("media-"+index);
  var foot=document.getElementById("foot-"+index);
  tile.className="tile failed";
  status.className="tile-status failed";
  status.textContent="FAILED";
  foot.textContent=proxy+" | "+(error||"Error");
  media.innerHTML="<div class=\"placeholder\">Skipped - proxy failed internal test</div>";
  if(!showFailed)tile.style.display="none";
  log("Proxy "+proxy+" FAILED: "+(error||"Error"),"error");
}
function skipTile(index,reason){
  var tile=document.getElementById("tile-"+index);
  if(!tile)return;
  tile.className="tile failed";
  document.getElementById("status-"+index).className="tile-status skipped";
  document.getElementById("status-"+index).textContent="SKIPPED";
  document.getElementById("media-"+index).innerHTML="<div class=\"placeholder\">"+reason+"</div>";
  if(!showFailed)tile.style.display="none";
}
async function testOneProxy(targetUrl,proxy,index){
  if(globalMode==="bot-test"){
    createTile(proxy,index);
    updateTileBotDetection(index,proxy,targetUrl);
    return true; // Bot test runs asynchronously, we just launched it
  }
  try{
    const res=await fetch("/api/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetUrl:targetUrl,proxy:proxy})});
    const data=await res.json();
    if(data.ok){createTile(proxy,index);updateTileSuccess(index,data.proxy,data.statusCode,targetUrl);}else{log("Proxy "+proxy+" FAILED: "+(data.error||"Error"),"error");}
    return data.ok;
  }catch(e){log("Proxy "+proxy+" FAILED: "+e.message,"error");return false;}
}
async function startTest(){
  if(running)return;
  running=true;
  showFailed=false;
  document.getElementById("toggleBtn").textContent="Show Failed";
  document.getElementById("testBtn").disabled=true;
  var targetUrl=document.getElementById("targetUrl").value.trim();
  var proxiesRaw=document.getElementById("proxies").value.trim();
  globalMode=document.getElementById("mode").value;
  if(!targetUrl){alert("Enter target URL");running=false;document.getElementById("testBtn").disabled=false;return;}
  if(!proxiesRaw){alert("Upload or paste proxy list");running=false;document.getElementById("testBtn").disabled=false;return;}
  proxyPool=proxiesRaw.split(String.fromCharCode(10)).map(function(l){return l.trim();}).filter(Boolean);
  var proxies=proxyPool.slice();
  proxyRoundRobin=0;
  document.getElementById("grid").innerHTML="";
  document.getElementById("logs").innerHTML="";
  updateStats(proxies.length,0,0,proxies.length);
  log("Starting internal test of "+proxies.length+" proxies against "+targetUrl);
  // Tiles created only on success
  var working=0,failed=0,completed=0;
  var promises=proxies.map(function(proxy,i){
    return testOneProxy(targetUrl,proxy,i).then(function(ok){
      if(!running){skipTile(i,"Stopped");return;}
      if(ok)working++;else failed++;
      completed++;
      updateStats(proxies.length,working,failed,proxies.length-working-failed);
    });
  });
  await Promise.all(promises);
  log("Done. Working: "+working+", Failed: "+failed,working>0?"success":"warn");
  running=false;
  document.getElementById("testBtn").disabled=false;
}
function stopTest(){running=false;log("Stopping...");}
function clearAll(){running=false;document.getElementById("grid").innerHTML="";document.getElementById("logs").innerHTML="";updateStats(0,0,0,0);document.getElementById("testBtn").disabled=false;log("Tiles cleared. Proxies and target URL preserved.");}
async function runBotTest(proxy,index){
  var targetUrl=document.getElementById("targetUrl").value.trim();
  var profile=document.getElementById("botProfile").value;
  log("Bot test ["+profile+"] via proxy "+(index+1)+" -> "+targetUrl,"warn");
  try{
    var res=await fetch("/api/bot-test",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({proxy:proxy,targetUrl:targetUrl,profile:profile})
    });
    var data=await res.json();
    if(!data.ok){
      log("Bot test proxy "+(index+1)+" error: "+data.error,"error");
      return;
    }
    var grid=document.getElementById("grid");
    var tile=document.createElement("div");
    tile.className="tile working";
    tile.innerHTML='<div class="bot-result"><div class="bot-title">Proxy '+(index+1)+' | Profile: '+profile+'</div><div>Page: '+data.pageTitle+'</div><div>Blocked: '+(data.blocked?"YES":"NO")+' | Captcha: '+(data.captcha?"YES":"NO")+' | Bot: '+(data.botDetected?"DETECTED":"CLEAN")+'</div><div>Video Loaded: '+(data.videoLoaded?"YES":"NO")+' | Playing: '+(data.videoPlaying?"YES":"NO")+'</div><div>Load Time: '+data.loadTime+'ms</div><div>Signals: '+(data.signals||[]).map(function(s){return '<span class="bot-signal '+(s.indexOf("block")>=0||s.indexOf("error")>=0||s.indexOf("captcha")>=0?"bad":"good")+'">'+s+'</span>'}).join("")+'</div></div>';
    grid.appendChild(tile);
    log("Bot test proxy "+(index+1)+" -> "+(data.botDetected?"DETECTED":"PASSED")+(data.videoPlaying?" | VIDEO PLAYING":""),data.botDetected?"error":"success");
  }catch(err){
    log("Bot test proxy "+(index+1)+" failed: "+err.message,"error");
  }
}

function toggleAutoRefresh(){
  autoRefreshEnabled=!autoRefreshEnabled;
  var btn=document.getElementById("autoRefreshBtn");
  btn.textContent=autoRefreshEnabled?"Auto Refresh: ON":"Auto Refresh: OFF";
  btn.style.background=autoRefreshEnabled?"#27ae60":"#e67e22";
  log("Auto Refresh "+(autoRefreshEnabled?"ENABLED":"DISABLED"),autoRefreshEnabled?"success":"warn");
}

async function autoFetchRestart(){
  if(!autoRefreshEnabled){return;}
  log("Auto Refresh: fetching fresh proxies...","warn");
  try{
    var res=await fetch("/api/proxies/all");
    if(!res.ok){throw new Error("HTTP "+res.status);}
    var json=await res.json();
    if(!json.ok){throw new Error(json.error||"Server error");}
    var lines=json.proxies||[];
    if(!lines.length){log("Auto Refresh: no proxies fetched","error");return;}
    document.getElementById("proxies").value=lines.join(String.fromCharCode(10));
    document.getElementById("fileLabel").textContent="Loaded: "+lines.length+" fresh proxies (auto)";
    log("Auto Refresh: loaded "+lines.length+" fresh proxies, restarting scan...","success");
    // Small delay before starting new scan
    setTimeout(function(){startTest();},2000);
  }catch(err){
    log("Auto Refresh fetch failed: "+err.message,"error");
  }
}

function clearAllData(){
  document.getElementById("grid").innerHTML="";
  document.getElementById("logs").innerHTML="";
  document.getElementById("proxies").value="";
  document.getElementById("targetUrl").value="";
  document.getElementById("fileLabel").textContent="Click to upload proxy list";
  updateStats(0,0,0,0);
  proxyPool=[];
  proxyRoundRobin=0;
  workingTileQueue=[];
  if(staggerTimer){clearTimeout(staggerTimer);staggerTimer=null;}
  running=false;
  document.getElementById("testBtn").disabled=false;
  log("All data cleared","warn");
}
