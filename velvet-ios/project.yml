name: VelvetAI
options:
  bundleIdPrefix: com.velvetassistant
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  VelvetApp:
    type: application
    platform: iOS
    sources:
      - path: VelvetApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velvetassistant.VelvetAI
        INFOPLIST_FILE: VelvetApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: VelvetApp/Velvet.entitlements
    dependencies:
      - target: VelvetKeyboard
        embed: true
  VelvetKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velvetassistant.VelvetAI.keyboard
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/Keyboard.entitlements
